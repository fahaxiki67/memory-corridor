name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check context_guard_lite tests

  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        # 并发回归要起 20~30 个子进程，只在最快的一格全量跑，其余格跳过
        # （测试侧按 MC_SKIP_CONCURRENCY=1 跳过，见 tests/test_concurrency.py）。
        include:
          - os: ubuntu-latest
            python-version: "3.12"
            run_concurrency: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
        env:
          MC_SKIP_CONCURRENCY: ${{ matrix.run_concurrency != true && '1' || '' }}

      - name: Validate packaging and CLI entry points
        run: |
          python -m pip install --disable-pip-version-check .
          memory-corridor --version
          context-guard --version
          python -m context_guard_lite --version
